
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Inter (teks) & Poppins (tajuk, jenama log masuk) dimuat sekali untuk seluruh aplikasi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Risk Management System</title>
    <script>
      // Tema lalai cerah; mod gelap hanya jika dipilih pengguna, dan tidak pada halaman log masuk
      var halamanAwam = /^\/(login|tukar-katalaluan)/.test(window.location.pathname);
      if (localStorage.getItem('theme') === 'dark' && !halamanAwam) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
